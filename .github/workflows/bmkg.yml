name: BMKG Monitor

on:
  schedule:
    - cron: "*/5 * * * *"   # tiap 5 menit (minimum yang didukung GitHub; jangan "* * * * *")
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/bmkg.yml"


permissions:
  contents: write

# Cegah dua run BMKG overlap (bisa conflict di last.json)
concurrency:
  group: bmkg-monitor
  cancel-in-progress: true

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10        # pengaman kalau script hang/loop
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0                 # full history biar pull --rebase aman
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run monitor
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }} 
          MIN_MAGNITUDE: ${{ secrets.MIN_MAGNITUDE }}
        run: node src/index.js

      - name: Commit updated last.json
        run: |
          set -euo pipefail
          git config user.name "RusdiEneri"
          git config user.email "nuruddinrusydiilham@gmail.com"

          git add data/last.json

          # Kalau nggak ada perubahan, skip (hemat & nggak error)
          if git diff --cached --quiet; then
            echo "last.json tidak berubah, skip commit"
            exit 0
          fi

          git commit -m "chore: update last gempa [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
