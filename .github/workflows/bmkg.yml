name: BMKG Monitor

on:
  schedule:
    # Jalankan setiap 5 menit
    - cron: "*/5 * * * *"
      timezone: "Asia/Jakarta"

  # Bisa dijalankan manual dari tab Actions
  workflow_dispatch:

  # Jalankan ulang jika workflow ini sendiri diubah
  push:
    paths:
      - ".github/workflows/bmkg.yml"

permissions:
  contents: write

# Mencegah lebih dari satu monitor berjalan bersamaan
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Checkout repository
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Setup Git
      - name: Setup Git
        run: |
          set -euo pipefail

          git config user.name "RusdiEneri"
          git config user.email "nuruddinrusydiilham@gmail.com"
          git config pull.rebase true

          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          git fetch origin main
          git checkout main
          git reset --hard origin/main

      # Pastikan folder data & assets tersedia
      - name: Prepare data & assets directory
        run: |
          mkdir -p data assets

          echo "Isi repository:"
          ls -la

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Install dependencies
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # Run BMKG Monitor (update README.md + assets/shakemap.jpg + data/history.json + data/last.json)
      - name: Run BMKG Monitor
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          MIN_MAGNITUDE: ${{ secrets.MIN_MAGNITUDE }}
        run: |
          node src/index.js

      # Cek apakah ada perubahan (last.json / history.json / README.md / shakemap)
      - name: Check for changes
        id: changes
        run: |
          set -euo pipefail

          git add -A data assets 2>/dev/null || true
          if [ -f README.md ]; then git add README.md; fi

          echo "Status perubahan:"
          git status --short

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "✅ Tidak ada perubahan."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "📝 Ada perubahan baru (README / shakemap / data)."
            git diff --cached --stat
          fi

      # Commit dan push
      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail

          TIMESTAMP=$(TZ=Asia/Jakarta date +"%Y-%m-%d %H:%M:%S WIB")
          git commit -m "docs: update info gempa & README - $TIMESTAMP [skip ci]"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt..."

            # Sinkronkan branch dengan commit terbaru
            if git pull --rebase origin main; then

              if git push origin HEAD:main; then
                echo "✅ Push berhasil."
                exit 0
              fi

            else
              echo "⚠️ Rebase gagal."
              git rebase --abort || true
            fi

            echo "Push gagal, mencoba lagi dalam 10 detik..."
            sleep 10
          done

          echo "❌ Push gagal setelah 5 percobaan."
          exit 1

      # Tidak ada perubahan
      - name: No changes
        if: steps.changes.outputs.changed == 'false'
        run: |
          echo "✅ Tidak ada gempa baru / tidak ada perubahan file."
          echo "Tidak membuat commit."