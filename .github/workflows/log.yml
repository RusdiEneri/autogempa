name: CI

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup git and branch tracking
        env:
          # Branch dinamis: otomatis mengikuti branch yang menjalankan workflow
          BRANCH: ${{ github.ref_name }}

          # Identity otomatis: menggunakan user yang menjalankan workflow
          GIT_USER: ${{ github.actor }}
          GIT_EMAIL: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com

        run: |
          git config user.name "$GIT_USER"
          git config user.email "$GIT_EMAIL"
          git config pull.rebase true

          git remote set-url origin \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

          git checkout -B "$BRANCH" "origin/$BRANCH"

      - name: Create 5 commits and push
        env:
          BRANCH: ${{ github.ref_name }}

        run: |
          for i in 1 2 3 4 5; do
            TIMESTAMP="$(TZ=Asia/Jakarta date '+%Y-%m-%d %H:%M:%S')"

            # Gunakan ">" agar log.txt DITIMPA, bukan ditambah
            printf '%s - Commit %s\n' "$TIMESTAMP" "$i" > log.txt

            git add log.txt
            git commit -m "Log commit $i - $TIMESTAMP"

            sleep 1
          done

          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin "$BRANCH"; then
              if git push origin "$BRANCH"; then
                echo "Push berhasil"
                exit 0
              fi
            else
              echo "Rebase gagal, membatalkan rebase..."
              git rebase --abort || true
            fi

            echo "Push gagal, coba lagi 10 detik... (percobaan $attempt)"
            sleep 10
          done

          echo "Push gagal setelah 5 percobaan."
          exit 1

